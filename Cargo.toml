[workspace]
members = [
    "crates/spo",
    "crates/tuffite",
    "crates/tuffite-abi",
    "crates/tuffite-ioc",
    "crates/tuffite-macros",
    "crates/tuffite-mojom",
    "crates/tuffite-runtime",
    "playground",
]
# playground needs a Chromium output tree to build. Keep it out of the
# default `cargo test`/`cargo check` set so pure-Rust CI passes without one.
default-members = [
    "crates/spo",
    "crates/tuffite",
    "crates/tuffite-abi",
    "crates/tuffite-ioc",
    "crates/tuffite-macros",
    "crates/tuffite-mojom",
    "crates/tuffite-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tuffite/tuffite"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
tuffite-abi = { path = "crates/tuffite-abi" }
tuffite-ioc = { path = "crates/tuffite-ioc", default-features = false}
tuffite-macros = { path = "crates/tuffite-macros" }
tuffite-mojom = { path = "crates/tuffite-mojom" }
tuffite-runtime = { path = "crates/tuffite-runtime" }

anyhow = "1"
thiserror = "2"
miette = { version = "7.6", default-features = false, features = ["derive"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
# FFI catches handler panics; unwinding must remain enabled in every profile.
debug = 1
panic = "unwind"
strip = "none"


# Reproducible CI packaging settings, selected with --profile ci.
[profile.ci]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
debug = 0
strip = "symbols"
