[package]
name = "tuffite-abi"
description = "Stable C ABI contract shared by Tuffite Runtime and Framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Maintainer-only: requires libclang and the Framework source headers.
bindgen = ["dep:bindgen", "dep:syn", "dep:prettyplease"]

[build-dependencies]
bindgen = { version = "=0.72.1", optional = true }
syn = { version = "2", features = ["full", "visit-mut"], optional = true }
prettyplease = { version = "0.2", optional = true }
